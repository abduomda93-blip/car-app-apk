name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Project & Merge Code
        run: |
          # 1. إنشاء مشروع جديد نظيف تماماً بـ V2 Embedding في مجلد مؤقت
          flutter create --org com.example temp_app
          
          # 2. نسخ مجلد android ومجالات البناء النظيفة إلى مشروعنا
          cp -r temp_app/android ./android
          
          # 3. تنظيف المجلد المؤقت
          rm -rf temp_app

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
